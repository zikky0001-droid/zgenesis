<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:type" content="website">

  <meta property="og:title" content="404 — THE GENESIS">
  <meta property="og:description" content="The requested page could not be found.">
  <meta property="og:url" content="https://zgenesis.vercel.app/404">
  <meta property="og:image" content="https://zgenesis.vercel.app/icon.jpg">
  <meta property="og:image:secure_url" content="https://zgenesis.vercel.app/icon.jpg">

  <meta property="og:image:width" content="525">

  <meta name="twitter:image" content="https://zgenesis.vercel.app/icon.jpg">
  <title>404 — Page Not Found | THE GENESIS</title>
  <style>
    :root{color-scheme:dark;--bg:#080d19;--panel:#101a2b;--line:#253650;--muted:#9aabc3;--text:#f4f7ff;--blue:#65a7ff;--cyan:#5ce1e6}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% 15%,#152b49 0%,var(--bg) 58%);color:var(--text);display:grid;place-items:center;padding:24px}
    .shell{width:min(100%,650px);text-align:center}.brand{display:inline-flex;align-items:center;gap:10px;color:#dceaff;font-size:13px;font-weight:800;letter-spacing:.2em}.mark{width:34px;height:34px;border:1px solid #41628b;border-radius:11px;display:grid;place-items:center;color:var(--cyan);background:#10213a;font-size:17px}
    .card{margin-top:30px;padding:clamp(28px,7vw,54px);border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(19,33,54,.96),rgba(11,19,33,.97));box-shadow:0 28px 90px #0008}
    .code{font-size:clamp(86px,20vw,150px);font-weight:900;line-height:.95;letter-spacing:-.09em;background:linear-gradient(110deg,#8dc2ff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 12px 55px #398de533}
    .eyebrow{margin:25px 0 8px;color:#a9caff;font-size:12px;font-weight:800;letter-spacing:.22em}.heading{margin:0;font-size:clamp(23px,5vw,34px);letter-spacing:-.035em}.copy{max-width:440px;margin:13px auto 0;color:var(--muted);font-size:15px;line-height:1.7}
    .route{margin:27px 0 25px;padding:15px 17px;border:1px solid #2a405e;border-radius:15px;background:#091322;text-align:left}.route-label{display:block;margin-bottom:7px;color:#8ea6c5;font-size:10px;font-weight:800;letter-spacing:.16em}.route-value{display:block;overflow-wrap:anywhere;color:#e5f0ff;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;line-height:1.6}
    .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.button{min-height:46px;display:inline-flex;align-items:center;justify-content:center;padding:0 20px;border-radius:13px;text-decoration:none;font-size:13px;font-weight:800;transition:transform .18s,background .18s}.button:hover{transform:translateY(-2px)}.primary{background:linear-gradient(110deg,#3986ef,#32b9d1);color:#06111f}.secondary{border:1px solid #344966;color:#d9e8ff;background:#132238}.foot{margin-top:24px;color:#71849f;font-size:11px;letter-spacing:.12em}
    @media(max-width:420px){body{padding:15px}.card{border-radius:22px}.actions{flex-direction:column}.button{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><span class="mark">G</span><span>THE GENESIS</span></div>
    <section class="card" aria-labelledby="page-title">
      <div class="code" aria-hidden="true">404</div>
      <p class="eyebrow">SIGNAL NOT FOUND</p>
      <h1 class="heading" id="page-title">This page isn't here.</h1>
      <p class="copy">The address may be incorrect, the page may have moved, or the link may no longer be available.</p>
      <div class="route"><span class="route-label">REQUESTED ROUTE</span><code class="route-value" id="requested-route">/</code></div>
      <div class="actions"><a class="button primary" href="/">Return to homepage</a><a class="button secondary" href="/api">Explore the API</a></div>
    </section>
    <p class="foot">ANIME DISCOVERY · VIDEO ACCESS · DEVELOPER API</p>
  </main>
  <script>
    (() => {
      const target = document.getElementById('requested-route');
      if (!target) return;
      target.textContent = window.location.pathname + window.location.search;
    })();
  </script>
</body>
</html>
